<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- House roof (doubles as compass north arrow) -->
  <path d="M16 5.5L8.5 14h15L16 5.5z" fill="white" opacity="0.9"/>
  <!-- House body -->
  <rect x="11" y="14" width="10" height="8" rx="1" fill="white" opacity="0.85"/>
  <!-- Door -->
  <rect x="14" y="17" width="4" height="5" rx="0.8" fill="#0D9488"/>
  <!-- Compass ticks -->
  <line x1="16" y1="4" x2="16" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="16" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="5" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="28" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
